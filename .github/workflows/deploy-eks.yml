# Reusable workflow: deploys this app to an EKS cluster (provisioned by
# https://github.com/luniemma/aws-terraform-infra) using Helm or Kustomize.
#
# Design choices (best practices, no hardcoded values):
#   * AWS auth via OIDC + IAM role assumption — no long-lived AWS keys.
#     The role to assume is passed as a secret, not baked into this file.
#   * Cluster name, region, namespace, image, tag, and method (helm|kustomize)
#     are all inputs. Callers select per-environment values via
#     GitHub Environments (so prod can require approvals).
#   * Helm path uses `upgrade --install --atomic --wait` so a failed rollout
#     auto-rolls back instead of leaving a half-applied release.
#   * `dry_run: true` runs `helm diff` / `kustomize build | kubectl diff` and
#     does not apply — meant for PRs.
#   * kubeconfig is written to a job-scoped temp dir and torn down on exit.
#   * Tools (helm, kubectl, kustomize) are pinned to caller-provided versions
#     so upgrades are explicit, not silent.
#
# Call from another workflow with:
#
#   jobs:
#     deploy:
#       uses: ./.github/workflows/deploy-eks.yml
#       permissions:
#         id-token: write   # OIDC token for AWS role assumption
#         contents: read
#       with:
#         environment: staging
#         aws_region: us-east-1
#         cluster_name: codeplex-staging
#         namespace: codeplex
#         method: helm
#         chart_path: helm/codeplex-ai
#         release_name: codeplex-ai
#         values_files: helm/codeplex-ai/values.yaml,helm/envs/staging.yaml
#         image_repository: ghcr.io/luniemma/codeplex-ai
#         image_tag: ${{ github.sha }}
#       secrets:
#         AWS_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

name: Deploy to EKS (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment to deploy into (e.g. staging, prod). Drives approvals and env-scoped secrets."
        type: string
        required: true
      aws_region:
        description: "AWS region of the target EKS cluster."
        type: string
        required: true
      cluster_name:
        description: "EKS cluster name (matches the cluster output from aws-terraform-infra)."
        type: string
        required: true
      namespace:
        description: "Target Kubernetes namespace. Created if missing."
        type: string
        required: true
      method:
        description: "Deployment method: 'helm' or 'kustomize'."
        type: string
        required: true
      # ---- Helm-only inputs -------------------------------------------------
      chart_path:
        description: "Path to the Helm chart in this repo (used when method=helm)."
        type: string
        required: false
        default: helm/codeplex-ai
      release_name:
        description: "Helm release name (used when method=helm)."
        type: string
        required: false
        default: codeplex-ai
      values_files:
        description: "Comma-separated values files, applied in order (last wins). Paths are relative to repo root."
        type: string
        required: false
        default: ""
      helm_extra_args:
        description: "Extra args appended to `helm upgrade --install` (e.g. '--set foo=bar')."
        type: string
        required: false
        default: ""
      # ---- Kustomize-only inputs --------------------------------------------
      kustomize_path:
        description: "Path to a kustomization directory (used when method=kustomize)."
        type: string
        required: false
        default: k8s
      # ---- Image (works for both methods) -----------------------------------
      image_repository:
        description: "Container image repository (no tag). Set to '' to skip image override."
        type: string
        required: false
        default: ""
      image_tag:
        description: "Image tag or digest to deploy. Prefer immutable refs (commit SHA or sha256:...)."
        type: string
        required: false
        default: ""
      # ---- Behaviour --------------------------------------------------------
      dry_run:
        description: "If true, render + diff only — never apply. Use for PR previews."
        type: boolean
        required: false
        default: false
      timeout:
        description: "Rollout/helm timeout (e.g. 5m, 10m)."
        type: string
        required: false
        default: "10m"
      wait_for_workload:
        description: "Optional 'kind/name' to `kubectl rollout status` after deploy (e.g. deployment/codeplex-ai)."
        type: string
        required: false
        default: ""
      # ---- Tool versions (pin explicitly so upgrades are intentional) -------
      kubectl_version:
        description: "kubectl version to install (e.g. v1.30.4). Empty = latest stable."
        type: string
        required: false
        default: "v1.30.4"
      helm_version:
        description: "Helm version to install (e.g. v3.16.2)."
        type: string
        required: false
        default: "v3.16.2"
      kustomize_version:
        description: "Kustomize version (e.g. 5.4.3, no leading v)."
        type: string
        required: false
        default: "5.4.3"
    secrets:
      AWS_ROLE_ARN:
        description: "IAM role ARN to assume via OIDC. Must be allowed to describe + access the EKS cluster."
        required: true
    outputs:
      release_revision:
        description: "Helm revision number after upgrade (helm method only)."
        value: ${{ jobs.deploy.outputs.release_revision }}

permissions: {}   # fall back to caller-granted perms; see header comment

jobs:
  deploy:
    name: Deploy (${{ inputs.method }} → ${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write   # required to mint the OIDC token for AWS
      contents: read
    timeout-minutes: 30
    outputs:
      release_revision: ${{ steps.helm-deploy.outputs.revision }}
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.method }}" in
            helm|kustomize) ;;
            *) echo "::error::method must be 'helm' or 'kustomize' (got '${{ inputs.method }}')"; exit 1 ;;
          esac
          if [[ "${{ inputs.method }}" == "helm" && -z "${{ inputs.chart_path }}" ]]; then
            echo "::error::chart_path is required when method=helm"; exit 1
          fi
          if [[ "${{ inputs.method }}" == "kustomize" && -z "${{ inputs.kustomize_path }}" ]]; then
            echo "::error::kustomize_path is required when method=kustomize"; exit 1
          fi
          if [[ -n "${{ inputs.image_repository }}" && -z "${{ inputs.image_tag }}" ]]; then
            echo "::error::image_tag is required when image_repository is set"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-deploy-${{ inputs.environment }}-${{ github.run_id }}
          # Audience must match the EKS OIDC trust policy in aws-terraform-infra.
          audience: sts.amazonaws.com

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ inputs.kubectl_version }}

      - name: Install Helm
        if: inputs.method == 'helm'
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm_version }}

      - name: Install Kustomize
        if: inputs.method == 'kustomize'
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ inputs.kustomize_version }}

      - name: Write kubeconfig for EKS cluster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KUBECONFIG")"
          aws eks update-kubeconfig \
            --region "${{ inputs.aws_region }}" \
            --name   "${{ inputs.cluster_name }}" \
            --kubeconfig "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl version --client=true
          kubectl config current-context

      - name: Ensure namespace exists
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          kubectl get ns "${{ inputs.namespace }}" >/dev/null 2>&1 \
            || kubectl create namespace "${{ inputs.namespace }}"

      # ----------------------------------------------------------------------
      # Helm path
      # ----------------------------------------------------------------------
      - name: Build Helm value/image flags
        if: inputs.method == 'helm'
        id: helm-flags
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          IFS=',' read -ra files <<< "${{ inputs.values_files }}"
          for f in "${files[@]}"; do
            f="$(echo "$f" | xargs)"   # trim
            [[ -z "$f" ]] && continue
            if [[ ! -f "$f" ]]; then
              echo "::error::values file not found: $f"; exit 1
            fi
            flags+=( "--values" "$f" )
          done
          if [[ -n "${{ inputs.image_repository }}" ]]; then
            flags+=( "--set" "image.repository=${{ inputs.image_repository }}" )
            flags+=( "--set" "image.tag=${{ inputs.image_tag }}" )
          fi
          # Render space-separated for the next step.
          printf 'flags=%s\n' "${flags[*]}" >> "$GITHUB_OUTPUT"

      - name: Helm dependency build
        if: inputs.method == 'helm'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${{ inputs.chart_path }}/Chart.lock" || -d "${{ inputs.chart_path }}/charts" ]]; then
            helm dependency build "${{ inputs.chart_path }}"
          fi

      - name: Helm diff (dry run)
        if: inputs.method == 'helm' && inputs.dry_run == true
        shell: bash
        run: |
          set -euo pipefail
          helm template "${{ inputs.release_name }}" "${{ inputs.chart_path }}" \
            --namespace "${{ inputs.namespace }}" \
            ${{ steps.helm-flags.outputs.flags }} \
            ${{ inputs.helm_extra_args }} \
            | tee /tmp/rendered.yaml >/dev/null
          echo "Rendered manifest size: $(wc -l < /tmp/rendered.yaml) lines"
          # Server-side dry run shows what would actually change in-cluster.
          kubectl diff -f /tmp/rendered.yaml || true

      # If a previous deploy hit the timeout mid-rollback, the release can
      # be left in pending-install/pending-upgrade/pending-rollback. Helm's
      # next `upgrade --install` then refuses with "another operation in
      # progress." Detect that state and recover before retrying so a single
      # bad deploy doesn't wedge the namespace.
      - name: Recover from stuck Helm release
        if: inputs.method == 'helm' && inputs.dry_run == false
        shell: bash
        env:
          RELEASE: ${{ inputs.release_name }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          status=$(helm status "$RELEASE" -n "$NAMESPACE" -o json 2>/dev/null | jq -r '.info.status' || true)
          case "${status:-}" in
            pending-install|pending-upgrade|pending-rollback)
              echo "::warning::Release $RELEASE in '$status' — uninstalling before retry to clear the lock"
              helm uninstall "$RELEASE" -n "$NAMESPACE" --wait --timeout 5m || true ;;
            "")
              echo "No existing release; first install." ;;
            *)
              echo "Existing release status: $status — proceeding with upgrade." ;;
          esac

      - name: Helm upgrade --install
        if: inputs.method == 'helm' && inputs.dry_run == false
        id: helm-deploy
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install "${{ inputs.release_name }}" "${{ inputs.chart_path }}" \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --atomic \
            --wait \
            --timeout "${{ inputs.timeout }}" \
            ${{ steps.helm-flags.outputs.flags }} \
            ${{ inputs.helm_extra_args }}
          revision=$(helm history "${{ inputs.release_name }}" -n "${{ inputs.namespace }}" -o json \
            | jq -r '.[-1].revision')
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "::notice::Helm release ${{ inputs.release_name }} now at revision ${revision}"

      # ----------------------------------------------------------------------
      # Kustomize path
      # ----------------------------------------------------------------------
      - name: Kustomize set namespace
        if: inputs.method == 'kustomize'
        shell: bash
        working-directory: ${{ inputs.kustomize_path }}
        run: |
          set -euo pipefail
          # Rewrites metadata.namespace AND RoleBinding subjects.namespace to
          # the env-scoped namespace. Plain `kubectl apply -n` would not catch
          # subjects, so RBAC would silently bind to the wrong namespace.
          kustomize edit set namespace "${{ inputs.namespace }}"

      - name: Kustomize image override
        if: inputs.method == 'kustomize' && inputs.image_repository != ''
        shell: bash
        working-directory: ${{ inputs.kustomize_path }}
        run: |
          set -euo pipefail
          kustomize edit set image "${{ inputs.image_repository }}=${{ inputs.image_repository }}:${{ inputs.image_tag }}"

      - name: Kustomize diff (dry run)
        if: inputs.method == 'kustomize' && inputs.dry_run == true
        shell: bash
        run: |
          set -euo pipefail
          kustomize build "${{ inputs.kustomize_path }}" > /tmp/rendered.yaml
          echo "Rendered manifest size: $(wc -l < /tmp/rendered.yaml) lines"
          kubectl diff -n "${{ inputs.namespace }}" -f /tmp/rendered.yaml || true

      - name: Kustomize apply
        if: inputs.method == 'kustomize' && inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          kustomize build "${{ inputs.kustomize_path }}" \
            | kubectl apply -n "${{ inputs.namespace }}" --server-side --prune=false -f -

      # ----------------------------------------------------------------------
      # Monitoring (helm path only) — applies the Prometheus + Grafana stack
      # and the shared Ingress that fronts app + prom + grafana behind one NLB.
      # The Helm chart owns app + redis; this step adds the rest. nginx-ingress
      # controller must already be installed cluster-wide.
      # ----------------------------------------------------------------------
      - name: Deploy monitoring (Prometheus + Grafana + Ingress)
        if: inputs.method == 'helm' && inputs.dry_run == false
        shell: bash
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          # `kustomize edit set namespace` rewrites metadata.namespace AND
          # RoleBinding subjects.namespace to the env-scoped namespace.
          (cd k8s/monitoring && kustomize edit set namespace "$NAMESPACE")

          # nginx-ingress's admission webhook treats Ingress routing rules
          # cluster-wide: two Ingresses on the same host:""+path conflict
          # across namespaces. Give each env its own host header by replacing
          # the placeholder in ingress.yaml with "<namespace>.codeplex.local".
          host="${NAMESPACE}.codeplex.local"
          sed -i "s/namespace-host\.codeplex\.local/${host}/g" k8s/monitoring/ingress.yaml
          echo "Rewrote Ingress host → ${host}"

          # `kubectl apply -k` hits kustomize's strict security mode, which
          # refuses resources outside the kustomization root (we use ../ refs
          # to share files with k8s/kustomization.yaml). Build with the load
          # restrictor relaxed and pipe to apply explicitly.
          kustomize build --load-restrictor=LoadRestrictionsNone k8s/monitoring/ \
            | kubectl apply --server-side -f -

          # Wait for the Ingress to bind a load balancer hostname (nginx-ingress
          # picks up the controller's NLB on first reconcile). This times out
          # cleanly if AWS hasn't provisioned the NLB yet (e.g. account ELB
          # block) — the next step gracefully falls back to port-forward URLs.
          # We suppress kubectl wait's noisy "error:" stderr to keep the log
          # clean; the actual presence of an LB hostname is checked properly
          # in the "Print endpoints" step.
          if kubectl -n "$NAMESPACE" wait --for=jsonpath='{.status.loadBalancer.ingress}' \
               ingress/codeplex-shared --timeout=180s 2>/dev/null; then
            echo "::notice::Ingress codeplex-shared has an LB hostname — endpoints step will emit public URLs."
          else
            echo "::notice::Ingress codeplex-shared has no LB hostname after 180s — endpoints step will fall back to port-forward commands. Check the nginx-ingress controller Service for AWS ELB issues."
          fi

      # ----------------------------------------------------------------------
      # Post-deploy verification
      # ----------------------------------------------------------------------
      - name: Wait for rollout
        if: inputs.dry_run == false && inputs.wait_for_workload != ''
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "${{ inputs.namespace }}" rollout status \
            "${{ inputs.wait_for_workload }}" \
            --timeout "${{ inputs.timeout }}"

      # End-to-end smoke test — hit each Service via its in-cluster DNS name to
      # confirm Service routing + endpoint slices + pod responses are all
      # working together. `kubectl rollout status` only confirms pods went
      # Ready; this confirms live HTTP requests return 2xx for app, Prometheus,
      # AND Grafana. Runs one curl pod that probes all three sequentially —
      # any non-2xx exits the pod non-zero, which fails the step.
      - name: Smoke test (HTTP probes — app, Prometheus, Grafana)
        if: inputs.method == 'helm' && inputs.dry_run == false
        shell: bash
        env:
          NAMESPACE: ${{ inputs.namespace }}
          RELEASE: ${{ inputs.release_name }}
        run: |
          set -euo pipefail
          # App service port (from the chart); default 8000 matches values.yaml.
          app_port=$(kubectl -n "$NAMESPACE" get svc "$RELEASE" \
            -o jsonpath='{.spec.ports[?(@.name=="http")].port}' 2>/dev/null || echo "8000")

          app_url="http://${RELEASE}.${NAMESPACE}.svc.cluster.local:${app_port}/livez"
          # Prometheus runs with --web.route-prefix=/prometheus, so /-/ready
          # lives under that subpath (same reason the Deployment probes were
          # fixed in 42-prometheus.yaml).
          prom_url="http://prometheus.${NAMESPACE}.svc.cluster.local:9090/prometheus/-/ready"
          # Grafana serves from /grafana subpath; /api/health is the standard
          # liveness endpoint.
          graf_url="http://grafana.${NAMESPACE}.svc.cluster.local:3000/grafana/api/health"

          echo "Probing all three services from inside the cluster…"
          # One curl pod, three sequential probes. The container exits with
          # the LAST command's exit code, so we && them to fail-fast on the
          # first non-2xx.
          kubectl -n "$NAMESPACE" run smoke-${GITHUB_RUN_ID:-$$} \
            --image=curlimages/curl:8.10.1 \
            --rm --restart=Never --quiet --attach=true \
            --command -- sh -c "
              echo '→ app /livez' && curl --fail --silent --show-error --max-time 10 ${app_url} && echo &&
              echo '→ prometheus /prometheus/-/ready' && curl --fail --silent --show-error --max-time 10 ${prom_url} && echo &&
              echo '→ grafana /grafana/api/health' && curl --fail --silent --show-error --max-time 10 ${graf_url} && echo
            "

          {
            echo "## Smoke test"
            echo ""
            echo "All three services returned 2xx on their in-cluster health endpoints:"
            echo ""
            echo "- App: \`${app_url}\`"
            echo "- Prometheus: \`${prom_url}\`"
            echo "- Grafana: \`${graf_url}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Smoke test::app + Prometheus + Grafana all healthy"

      # Emit the three service URLs to the workflow run summary. If the shared
      # Ingress already has an NLB hostname, those URLs are public and clickable.
      # If it doesn't (e.g. AWS account doesn't yet support creating ELBs, or
      # the controller's LB is still provisioning), fall back to ready-to-paste
      # `kubectl port-forward` commands keyed to the cluster + namespace.
      - name: Print endpoints
        if: inputs.method == 'helm' && inputs.dry_run == false
        id: endpoints
        shell: bash
        env:
          CLUSTER:   ${{ inputs.cluster_name }}
          REGION:    ${{ inputs.aws_region }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          host=$(kubectl -n "$NAMESPACE" get ingress codeplex-shared \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -z "$host" ]; then
            host=$(kubectl -n "$NAMESPACE" get ingress codeplex-shared \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
          fi

          {
            echo "## Endpoints"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$host" ]; then
            app_url="http://${host}/"
            prom_url="http://${host}/prometheus"
            graf_url="http://${host}/grafana"
            echo "host=${host}"      >> "$GITHUB_OUTPUT"
            echo "app_url=${app_url}" >> "$GITHUB_OUTPUT"

            {
              echo "Public — shared Ingress NLB:"
              echo ""
              echo "| Service | URL |"
              echo "|---|---|"
              echo "| App        | [\`${app_url}\`](${app_url}) |"
              echo "| Prometheus | [\`${prom_url}\`](${prom_url}) |"
              echo "| Grafana    | [\`${graf_url}\`](${graf_url}) |"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::notice title=App::${app_url}"
            echo "::notice title=Prometheus::${prom_url}"
            echo "::notice title=Grafana::${graf_url}"
          else
            echo "::warning::Shared Ingress has no LB address yet — emitting port-forward commands instead. Check 'kubectl -n ingress-nginx describe svc ingress-nginx-controller' to see why."

            kc="aws eks update-kubeconfig --region ${REGION} --name ${CLUSTER}"
            {
              echo "Local — Ingress LB not provisioned yet (often AWS account ELB block, or controller still pending). Run these to browse:"
              echo ""
              echo '```bash'
              echo "${kc}"
              echo "kubectl -n ${NAMESPACE} port-forward svc/codeplex-ai 18000:8000   # App        → http://localhost:18000"
              echo "kubectl -n ${NAMESPACE} port-forward svc/prometheus  19090:9090   # Prometheus → http://localhost:19090/prometheus"
              echo "kubectl -n ${NAMESPACE} port-forward svc/grafana     13000:3000   # Grafana    → http://localhost:13000/grafana"
              echo '```'
              echo ""
              echo "Grafana login: \`admin\` / \`admin\` (change before exposing publicly)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Deploy → ${{ inputs.environment }}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Method | ${{ inputs.method }} |"
            echo "| Cluster | ${{ inputs.cluster_name }} (${{ inputs.aws_region }}) |"
            echo "| Namespace | ${{ inputs.namespace }} |"
            echo "| Image | ${{ inputs.image_repository }}:${{ inputs.image_tag }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            if [[ "${{ inputs.method }}" == "helm" ]]; then
              echo "| Release | ${{ inputs.release_name }} |"
              echo "| Revision | ${{ steps.helm-deploy.outputs.revision }} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scrub kubeconfig
        if: always()
        shell: bash
        run: rm -f "$KUBECONFIG" || true
