# Caller workflow that delegates to build-docker.yml.
# - On every push to master: build, smoke test, and publish to GHCR + Docker Hub.
# - On pull requests: build and smoke test only — never push.
#
# Required repo secrets for Docker Hub publishing:
#   DOCKERHUB_USERNAME — your Docker Hub login
#   DOCKERHUB_TOKEN    — Docker Hub access token (NOT your password)

name: Docker

on:
  push:
    # release/** branches are included so that creating release/x.y.z auto-builds
    # an image that the Deploy workflow_run trigger can pick up for auto_staging.
    branches: [master, main, "release/**"]
    # Avoid running for doc-only changes that can't break the build.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.dev"
      - "requirements.txt"
      - "main.py"
      - "app/**"
      - "gunicorn_config.py"
      - ".github/workflows/docker.yml"
      - ".github/workflows/build-docker.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the resulting image to both registries"
        type: boolean
        required: false
        default: false

# Workflow-scope permissions matter for workflow_run inheritance: when the
# Deploy workflow is triggered by THIS workflow completing, its GITHUB_TOKEN
# is capped at whatever this workflow has at workflow scope. Without
# id-token: write here, the downstream auto_dev / auto_staging jobs can't
# mint OIDC tokens to assume the AWS deploy role and fail with the
# misleading "No OpenIDConnect provider found" error.
permissions:
  contents: read
  packages: write          # GHCR push (used by the build job)
  id-token: write          # cosign keyless signing + downstream Deploy OIDC
  security-events: write   # Trivy SARIF upload

jobs:
  build:
    name: Build & publish image
    uses: ./.github/workflows/build-docker.yml
    permissions:
      contents: read
      packages: write          # GHCR push
      id-token: write          # cosign keyless signing via Sigstore OIDC
      security-events: write   # Trivy SARIF upload to Code Scanning
    with:
      # Push when pushing to master/main, or on manual dispatch with push=true.
      # Otherwise just build + smoke test (PRs, doc changes, etc.).
      push_to_ghcr: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      push_to_dockerhub: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      # Edit this to your Docker Hub user/repo if it differs from `luniemma`.
      dockerhub_image: "luniemma/codeplex.ai"
    secrets: inherit
