# Per-env overlay: dev namespace on the shared codeplex-eks cluster.
# Applied AFTER helm/codeplex-ai/values.yaml, so anything here wins.

replicaCount: 1

# Provider keys come from a Kubernetes Secret managed out-of-band — never
# commit real keys to git. Create the Secret once per cluster:
#
#   kubectl -n codeplex-dev create secret generic codeplex-ai-real-secrets \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=GOOGLE_API_KEY=AIza... \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
#
# `existingSecret` makes the chart skip rendering its own Secret and bind the
# Deployment's envFrom to this one instead.
secrets:
  create: false
  existingSecret: codeplex-ai-real-secrets

config:
  ENVIRONMENT: development
  DEBUG: "True"
  LOG_LEVEL: DEBUG
  ENABLE_CACHING: "True"
  ENABLE_RATE_LIMITING: "False"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: false

# Bundled Redis is fine for dev — no external dependency.
redis:
  enabled: true
