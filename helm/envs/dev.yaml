# Per-env overlay: dev namespace on the shared codeplex-eks cluster.
# Applied AFTER helm/codeplex-ai/values.yaml, so anything here wins.

replicaCount: 1

# /readyz returns 200 only if at least one provider key is non-empty and
# doesn't start with "your_". Dev gets a placeholder so pods pass readiness
# without needing real keys committed to git. Outbound API calls will return
# auth errors when exercised — that's expected for dev. Stand up a real
# Secret out-of-band and switch to existingSecret if dev needs real calls.
secrets:
  create: true
  existingSecret: ""
  values:
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    GOOGLE_API_KEY: "dev-placeholder-not-a-real-key"
    SECRET_KEY: "dev-secret-key-not-for-production"
    JWT_SECRET: "dev-jwt-secret-not-for-production"

config:
  ENVIRONMENT: development
  DEBUG: "True"
  LOG_LEVEL: DEBUG
  ENABLE_CACHING: "True"
  ENABLE_RATE_LIMITING: "False"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

ingress:
  enabled: false

# Bundled Redis is fine for dev — no external dependency.
redis:
  enabled: true
