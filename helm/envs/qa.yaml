# Per-env overlay: qa namespace on the shared codeplex-eks cluster.

replicaCount: 1

config:
  ENVIRONMENT: qa
  DEBUG: "False"
  LOG_LEVEL: INFO
  ENABLE_CACHING: "True"
  ENABLE_RATE_LIMITING: "True"

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false

redis:
  enabled: true
